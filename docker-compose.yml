services:
  app:
    image: ghcr.io/bunnycharl/family-planner:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
